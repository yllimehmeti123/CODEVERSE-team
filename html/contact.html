<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <title>Contact us</title>
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">CODE<span>VERSE</span>.</h2>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href ="contact.html">Contact Us</a>
                <a href="about.html">About</a>
            
                

            </div>

            <a href="#courses" class="nav-btn">Start Learning ↗</a>
        </nav>
    </header>

<section class="contact-section">

    <div class="contact-container">

        <!-- LEFT SIDE -->
        <div class="contact-info">

            <h1>Contact <span>Us.</span></h1>

            <p>
                Have a question, idea or project in mind?
                We'd love to hear from you.
                Send us a message and let's create something amazing together.
            </p>

            <div class="contact-detail">
                <strong>Email</strong>
                info@yourwebsite.com
            </div>

            <div class="contact-detail">
                <strong>Phone</strong>
                +383 44 123 456
            </div>

            <div class="contact-detail">
                <strong>Location</strong>
                Prishtina, Kosovo
            </div>

        </div>


        <!-- RIGHT SIDE - FORM -->
        <form class="contact-form" action="#" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Your Name"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Your Email"
                required
            >

            <input
                type="text"
                name="subject"
                placeholder="Subject"
                required
            >

            <textarea
                name="message"
                placeholder="Write your message here..."
                required
            ></textarea>

            <button type="submit">
                Send Message →
            </button>

        </form>

    </div>

</section>
<script src="C:\Users\Student\Desktop\CODEVERSE-team\js\contact.js"></script>
</body>
</html>
